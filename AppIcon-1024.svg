<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13A07A"/>
      <stop offset="100%" stop-color="#0A5E48"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1FC490" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A5E48" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="inner-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background — solid, no rounded corners (Apple clips to its own shape) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <ellipse cx="512" cy="400" rx="500" ry="400" fill="url(#glow)"/>

  <!-- Inner border ring — gold accent -->
  <rect x="40" y="40" width="944" height="944"
        rx="0" ry="0"
        fill="none"
        stroke="#D4A017"
        stroke-width="10"
        opacity="0.45"/>

  <!-- Scale of Justice — centered, bold, white -->
  <!-- Beam / top bar -->
  <rect x="192" y="336" width="640" height="32" rx="16" fill="#FFFFFF" opacity="0.95"/>

  <!-- Center post -->
  <rect x="496" y="248" width="32" height="392" rx="16" fill="#FFFFFF" opacity="0.95"/>

  <!-- Center pivot circle -->
  <circle cx="512" cy="256" r="40" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="512" cy="256" r="22" fill="#13A07A"/>

  <!-- Left pan chain -->
  <line x1="256" y1="352" x2="256" y2="468" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- Right pan chain -->
  <line x1="768" y1="352" x2="768" y2="468" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- Left scale pan (slightly raised = balance) -->
  <path d="M148 468 Q148 548 256 548 Q364 548 364 468 Z"
        fill="#FFFFFF" opacity="0.92"/>

  <!-- Right scale pan (level) -->
  <path d="M660 468 Q660 548 768 548 Q876 548 876 468 Z"
        fill="#FFFFFF" opacity="0.92"/>

  <!-- Base pedestal -->
  <rect x="448" y="640" width="128" height="24" rx="12" fill="#FFFFFF" opacity="0.7"/>
  <rect x="368" y="656" width="288" height="32" rx="16" fill="#FFFFFF" opacity="0.55"/>
  <rect x="312" y="680" width="400" height="24" rx="12" fill="#FFFFFF" opacity="0.4"/>

  <!-- Maple leaf accent — small, centered below scale, above base -->
  <g transform="translate(472, 596) scale(0.5)" opacity="0.6">
    <path d="M40 0 C40 0 32 20 24 24 C16 28 0 24 0 24 C0 24 8 36 12 36 C12 36 8 56 8 56 L24 52 L24 72 L40 72 L40 52 L56 56 L56 36 C56 36 72 36 72 36 C72 36 76 24 64 24 C52 24 40 0 40 0 Z"
          fill="#D4A017"/>
  </g>

  <!-- Bottom wordmark area — thin gold line separator -->
  <rect x="180" y="760" width="664" height="3" rx="1.5" fill="#D4A017" opacity="0.5"/>

  <!-- "PEC" monogram text -->
  <text x="512" y="850"
        font-family="-apple-system, 'Georgia', serif"
        font-size="88"
        font-weight="700"
        fill="#FFFFFF"
        text-anchor="middle"
        opacity="0.88"
        letter-spacing="-2">PEC</text>

  <!-- Tagline -->
  <text x="512" y="916"
        font-family="-apple-system, 'Helvetica Neue', sans-serif"
        font-size="34"
        font-weight="400"
        fill="#FFFFFF"
        text-anchor="middle"
        opacity="0.55"
        letter-spacing="4">CANADA</text>
</svg>
