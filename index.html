    { id: 519, area: "ethics", lvl: "A", prov: "NL", stem: "A NL lawyer who discovers a trust shortfall must:", opts: ["Cover it quietly", "Correct the shortfall and report as required under LSNL rules", "Wait for an audit", "Blame the bookkeeper"], ans: 1, src: "Law Society of Newfoundland and Labrador — Professional Conduct", exp: "Trust shortfalls must be corrected and reported; concealment is professional misconduct.", notes: ["Concealment is improper.", "Correct.", "Delay is improper.", "Blame-shifting does not help."] },

    { id: 524, area: "admin", lvl: "A", prov: "NT", stem: "The WSCC is notable because it covers:", opts: ["Only the NWT", "Both the Northwest Territories and Nunavut", "Only Alberta and the NWT", "All of northern Canada"], ans: 1, src: "Workers' Compensation Act (Northwest Territories and Nunavut)", exp: "The WSCC serves as the workers' compensation body for both the NWT and Nunavut — a shared arrangement reflecting their shared history.", notes: ["It covers two territories.", "Correct.", "Not Alberta.", "Not all of northern Canada."] },

    { id: 526, area: "admin", lvl: "C", prov: "NT", stem: "The Northwest Territories Human Rights Commission processes complaints under the:", opts: ["Canadian Charter of Rights only", "Human Rights Act (Northwest Territories)", "Employment Standards Act only", "Territorial Court Act"], ans: 1, src: "Human Rights Act (Northwest Territories)", exp: "The NWT Human Rights Commission processes complaints under the Human Rights Act.", notes: ["The territorial statute applies.", "Correct.", "Different legislation.", "Wrong."] },

    { id: 529, area: "ethics", lvl: "C", prov: "NT", stem: "A NWT lawyer's duty of confidentiality:", opts: ["Ends with the retainer", "Continues indefinitely, including after the client's death", "Lasts only 5 years", "Applies only in court matters"], ans: 1, src: "Law Society of NWT — Code of Professional Conduct", exp: "Confidentiality survives the retainer and the client's death.", notes: ["It survives.", "Correct.", "No expiry.", "All communications."] },
    { id: 530, area: "civil", lvl: "A", prov: "NT", stem: "Appeals from the NWT Supreme Court lie to:", opts: ["The Territorial Court", "The Court of Appeal of the Northwest Territories", "The Federal Court", "The Supreme Court of Canada directly"], ans: 1, src: "Judicature Act (NWT)", exp: "The Court of Appeal of the NWT hears appeals from the Supreme Court of the NWT.", notes: ["Territorial Court is a lower court.", "Correct.", "For federal matters.", "Not the first appeal."] },
    { id: 531, area: "admin", lvl: "C", prov: "NT", stem: "The Human Rights Act (NWT) prohibits discrimination in areas including:", opts: ["Employment only", "Employment, tenancy, and services, among other areas", "Government services only", "Schools only"], ans: 1, src: "Human Rights Act (Northwest Territories)", exp: "The NWT Human Rights Act prohibits discrimination across multiple social areas including employment and tenancy.", notes: ["Broader.", "Correct.", "Broader.", "Much broader."] },
    { id: 532, area: "admin", lvl: "A", prov: "NT", stem: "Under the WSCC's no-fault system, an NWT worker injured at work generally:", opts: ["Can sue their employer", "Cannot sue their employer but receives WSCC compensation", "Chooses between WSCC and court", "Receives nothing if partly at fault"], ans: 1, src: "Workers' Compensation Act (NWT)", exp: "The WSCC's no-fault system bars civil suits against employers for covered workplace injuries.", notes: ["Barred.", "Correct.", "No choice.", "No-fault."] },

    { id: 534, area: "civil", lvl: "C", prov: "NT", stem: "The Canadian Charter of Rights and Freedoms applies to NWT proceedings:", opts: ["Only if the NWT adopts it separately", "Yes — it is federal legislation that applies across all of Canada including the territories", "Only to criminal matters in NWT", "Only in the Supreme Court of Canada"], ans: 1, src: "Canadian Charter of Rights and Freedoms", exp: "The Charter applies across Canada including all territories, binding government action at all levels.", notes: ["Territories are bound by the federal Charter.", "Correct.", "It applies broadly.", "It applies throughout all courts."] },
    { id: 535, area: "poa", lvl: "A", prov: "NT", stem: "An NWT driver who receives a traffic ticket and wants to dispute it must:", opts: ["Simply not pay it", "Request a hearing within the time stated on the ticket", "Contact the police officer", "File with the Human Rights Commission"], ans: 1, src: "Traffic Safety Act / Summary Conviction Procedures Act (NWT)", exp: "Disputing an NWT traffic ticket requires requesting a hearing within the applicable time limit.", notes: ["Leads to default conviction.", "Correct.", "Not the mechanism.", "Wrong body."] },
    /* ============== NUNAVUT — 15 QUESTIONS (536-550) ============== */
    { id: 536, area: "ethics", lvl: "C", prov: "NU", stem: "Lawyers in Nunavut are regulated by:", opts: ["The Law Society of Northwest Territories", "The Law Society of Nunavut", "The Nunavut Justice Department", "The Canadian Bar Association"], ans: 1, src: "Legal Profession Act (Nunavut)", exp: "The Law Society of Nunavut is the legal regulator for lawyers in Nunavut.", notes: ["Separate law society for NU.", "Correct.", "Government.", "Advisory body."] },
    { id: 537, area: "civil", lvl: "C", prov: "NU", stem: "Nunavut's court system is unique in Canada because:", opts: ["It has no courts", "The Nunavut Court of Justice is a unified court combining the functions of a superior court and a territorial court", "It uses only traditional law", "Its courts are federal only"], ans: 1, src: "Nunavut Act / Judicature Act (Nunavut)", exp: "The Nunavut Court of Justice is unique in Canada — a single unified court serving both the superior and territorial court functions.", notes: ["NU has courts.", "Correct — this is unique to Nunavut in Canada.", "The NuCJ applies Canadian law.", "The court is territorial."] },
    { id: 538, area: "admin", lvl: "C", prov: "NU", stem: "Workplace injury compensation in Nunavut is administered by:", opts: ["A Nunavut-only body", "The Workers' Safety and Compensation Commission (WSCC) — shared with the NWT", "WSIB Ontario on their behalf", "Employment Insurance"], ans: 1, src: "Workers' Compensation Act (Nunavut)", exp: "The WSCC serves as the workers' compensation body for both Nunavut and the NWT.", notes: ["Shared with NWT.", "Correct.", "Ontario's body.", "Different program."] },
    { id: 539, area: "admin", lvl: "C", prov: "NU", stem: "Human rights complaints in Nunavut are filed directly with:", opts: ["A commission that investigates first", "The Human Rights Tribunal of Nunavut — directly, without a prior commission investigation", "The WSCC", "The Nunavut Court of Justice"], ans: 1, src: "Nunavut Human Rights Act", exp: "Unlike most provinces, Nunavut's Human Rights Tribunal receives complaints directly without a prior commission investigation step.", notes: ["NU goes directly to the Tribunal.", "Correct — this is a distinguishing feature of Nunavut's system.", "Different body.", "Not the first forum."] },
    { id: 540, area: "admin", lvl: "C", prov: "NU", stem: "Residential tenancy disputes in Nunavut are handled by:", opts: ["The Landlord and Tenant Board", "The Rental Office (Nunavut) under the Residential Tenancies Act", "The Human Rights Tribunal", "The Nunavut Court of Justice only"], ans: 1, src: "Residential Tenancies Act (Nunavut)", exp: "The Rental Office administers the Nunavut Residential Tenancies Act and resolves landlord-tenant disputes.", notes: ["Ontario body.", "Correct.", "Different mandate.", "Rental Office is the first forum."] },
    { id: 541, area: "poa", lvl: "C", prov: "NU", stem: "Traffic offences in Nunavut are governed by the:", opts: ["Criminal Code alone", "Motor Vehicles Act (Nunavut)", "Federal Motor Vehicle Safety Act", "Highway Traffic Act (Ontario)"], ans: 1, src: "Motor Vehicles Act (Nunavut)", exp: "Nunavut's Motor Vehicles Act governs road use and traffic offences in the territory.", notes: ["Federal criminal law is separate.", "Correct.", "Federal safety standards.", "Ontario legislation."] },

    { id: 543, area: "admin", lvl: "A", prov: "NU", stem: "The Nunavut Human Rights Act is unique because complaints go:", opts: ["Through a commission investigation first, as in most provinces", "Directly to the Human Rights Tribunal without a prior commission investigation", "To the WSCC first", "To the Nunavut Court of Justice only"], ans: 1, src: "Nunavut Human Rights Act", exp: "Under the NHRA, complainants file directly with the Tribunal, bypassing the commission investigation stage common in other provinces.", notes: ["NU skips the commission step.", "Correct.", "WSCC handles workers comp.", "Not the first forum."] },
    { id: 544, area: "ethics", lvl: "C", prov: "NU", stem: "A Nunavut lawyer's duty of confidentiality:", opts: ["Ends with the retainer", "Continues indefinitely after the retainer and after the client's death", "Lasts 5 years", "Applies only to court matters"], ans: 1, src: "Law Society of Nunavut — Code of Professional Conduct", exp: "Confidentiality is ongoing — it survives the retainer and the client's death.", notes: ["It survives.", "Correct.", "No expiry.", "All communications."] },
    { id: 545, area: "admin", lvl: "A", prov: "NU", stem: "Inuit Qaujimajatuqangit (IQ) in Nunavut refers to:", opts: ["Nunavut's criminal code", "Traditional Inuit knowledge and values that inform Nunavut governance and public policy", "The Nunavut court system", "Nunavut's tax system"], ans: 1, src: "Nunavut Act / Government of Nunavut", exp: "IQ encompasses traditional Inuit knowledge, values, and practices; it is incorporated into Nunavut government policies and decisions.", notes: ["Nunavut uses the Criminal Code of Canada.", "Correct.", "Not the court system.", "Not tax."] },
    { id: 546, area: "practice", lvl: "A", prov: "NU", stem: "Under Nunavut's WSCC no-fault system, an injured worker generally:", opts: ["Can sue their employer", "Cannot sue their employer but receives WSCC compensation", "Chooses between WSCC and court", "Gets nothing if at fault"], ans: 1, src: "Workers' Compensation Act (Nunavut)", exp: "Nunavut's no-fault WSCC system bars civil suits against employers for covered workplace injuries.", notes: ["Barred.", "Correct.", "No choice.", "No-fault."] },
    { id: 547, area: "ethics", lvl: "A", prov: "NU", stem: "Unauthorized practice of law in Nunavut is prohibited under:", opts: ["Federal regulations only", "The Legal Profession Act (Nunavut)", "Only civil liability", "Common law only"], ans: 1, src: "Legal Profession Act (Nunavut)", exp: "The Legal Profession Act prohibits unauthorized legal practice in Nunavut.", notes: ["Territorial legislation governs.", "Correct.", "Has regulatory consequences.", "Statute governs."] },
    { id: 548, area: "civil", lvl: "C", prov: "NU", stem: "The Canadian Charter of Rights and Freedoms applies in Nunavut:", opts: ["Only if Nunavut's government adopts it", "Yes — the Charter applies across all of Canada, including the territories", "Only to criminal matters", "Only to federally employed persons"], ans: 1, src: "Canadian Charter of Rights and Freedoms", exp: "The Charter applies throughout Canada including all territories, binding all levels of government.", notes: ["Territories are bound.", "Correct.", "It applies broadly.", "All governmental action."] },
    { id: 549, area: "admin", lvl: "C", prov: "NU", stem: "The Human Rights Act (Nunavut) prohibits discrimination in areas such as:", opts: ["Employment only", "Employment, accommodation, and services, among other areas", "Government services only", "Schools only"], ans: 1, src: "Nunavut Human Rights Act", exp: "The NHRA prohibits discrimination in employment, accommodation, services, and other defined areas.", notes: ["Broader.", "Correct.", "Broader.", "Much broader."] },
    { id: 550, area: "poa", lvl: "A", prov: "NU", stem: "A Nunavut driver who receives a traffic ticket and wants to dispute it must:", opts: ["Simply not pay it", "Request a hearing within the time specified on the ticket", "Contact the issuing officer", "Apply to the Human Rights Tribunal"], ans: 1, src: "Motor Vehicles Act / Summary Conviction Procedures Act (Nunavut)", exp: "Disputing a Nunavut traffic ticket requires requesting a hearing within the applicable time limit.", notes: ["Leads to default conviction.", "Correct.", "Not the mechanism.", "Wrong body."] },
