    { id: 187, area: "practice", lvl: "C", stem: "Professional liability (errors & omissions) insurance for paralegals primarily:",
        opts: ["Pays the annual fee", "Protects clients and the paralegal if a negligence claim arises", "Covers office rent", "Is optional decoration"], ans: 1,

        notes: ["Different obligation.", "Correct.", "Not its purpose.", "It's required, not optional."] },
    { id: 188, area: "practice", lvl: "A", stem: "To meet confidentiality duties when using technology, a paralegal should:",

        src: "Paralegal Rules of Conduct — confidentiality / technology", exp: "Confidentiality extends to electronic information; reasonable safeguards are required.",
        notes: ["Weak/shared passwords are risky.", "Correct.", "Insecure.", "Insecure."] },
    { id: 189, area: "practice", lvl: "C", stem: "Sole practitioners are encouraged (and may be required) to have:",

        notes: ["A plan is needed.", "Correct.", "Unrelated.", "Unrelated."] },
    { id: 190, area: "practice", lvl: "A", stem: "Client identification requirements generally apply:",

        notes: ["It applies.", "Correct.", "Not limited to cash.", "Must be at intake, not after."] },
    { id: 191, area: "practice", lvl: "C", stem: "Disbursements are:",

        notes: ["Not profit.", "Correct.", "Unrelated.", "Unrelated."] },
    { id: 192, area: "practice", lvl: "A", stem: "A paralegal should decline a retainer where:",

    { id: 193, area: "practice", lvl: "C", stem: "A paralegal firm's name and marketing must:",

        src: "Paralegal Rules of Conduct — marketing", exp: "Marketing must not be misleading, including about whether the provider is a paralegal or a lawyer.",
        notes: ["Implying lawyer status misleads.", "Correct.", "Promises mislead.", "Status should be clear."] },
    /* ---- CONTRACT & TORT ---- */
    { id: 194, area: "contract", lvl: "C", stem: "A contract is generally formed when:",
        opts: ["One party thinks about an offer", "There is a valid offer, an unqualified acceptance, and consideration", "Someone advertises a price", "A party changes their mind"], ans: 1,
        src: "Contract law — formation", exp: "Formation requires offer, acceptance, consideration, and intention; a counter-offer is not acceptance.",
        notes: ["Thinking isn't accepting.", "Correct.", "Ads are usually invitations to treat.", "Changing one's mind isn't formation."] },
    { id: 195, area: "contract", lvl: "A", stem: "The doctrine of privity generally means that a contract:",
        opts: ["Binds the whole world", "Creates rights and obligations mainly for the parties to it, not strangers", "Is always public", "Cannot be written"], ans: 1,
        src: "Contract law — privity", exp: "Generally only the parties to a contract can enforce or be bound by it, subject to recognized exceptions.",
        notes: ["It doesn't bind strangers.", "Correct.", "Privacy isn't the point.", "Contracts can be written."] },
    { id: 196, area: "contract", lvl: "C", stem: "Which is an equitable remedy a court might order for breach of contract?",
        opts: ["Imprisonment", "Specific performance (ordering performance)", "A set fine", "A demerit point"], ans: 1,
        src: "Contract law — remedies", exp: "Specific performance compels performance and is available where damages are inadequate (e.g., unique property).",
        notes: ["Breach of contract isn't jailable.", "Correct.", "POA concept.", "POA concept."] },
    { id: 197, area: "contract", lvl: "A", stem: "If an unforeseen event, through no fault of either party, makes performance impossible, the contract may be:",
        opts: ["Automatically criminal", "Discharged by frustration", "Doubled in price", "Ignored"], ans: 1,
        src: "Contract law — frustration", exp: "Frustration can discharge a contract where a supervening event makes performance impossible or radically different, without fault.",
        notes: ["Not criminal.", "Correct.", "No automatic price change.", "It has legal effect."] },
    { id: 198, area: "contract", lvl: "C", stem: "Intentional, non-consensual harmful or offensive physical contact is the tort of:",
        opts: ["Negligence", "Battery", "Defamation", "Nuisance"], ans: 1,
        src: "Tort law — intentional torts", exp: "Battery is intentional, non-consensual harmful or offensive contact; assault is the apprehension of such contact.",
        notes: ["Negligence is unintentional.", "Correct.", "Defamation concerns reputation.", "Nuisance concerns land use."] },
    { id: 199, area: "contract", lvl: "A", stem: "A defamation claim generally requires a statement that is:",
        opts: ["True and flattering", "Defamatory, refers to the plaintiff, and is published to a third party", "Private and unspoken", "Clearly labelled opinion"], ans: 1,
        src: "Tort law — defamation", exp: "Defamation requires a defamatory statement about the plaintiff communicated to at least one other person; truth is a defence.",
        notes: ["Truth is a defence.", "Correct.", "Publication is required.", "Pure labelled opinion may be protected."] },
    { id: 200, area: "contract", lvl: "C", stem: "An occupier of premises in Ontario generally owes visitors a duty to:",
        opts: ["Guarantee no one is ever hurt", "Take reasonable care to keep the premises reasonably safe", "Ignore hazards", "Insure every visitor's car"], ans: 1,
        src: "Occupiers' Liability Act", exp: "Occupiers must take reasonable care that persons and their property on the premises are reasonably safe.",
        notes: ["No absolute guarantee.", "Correct.", "Ignoring hazards breaches the duty.", "Unrelated."] },

    /* ---- ETHICS ---- */
    { id: 201, area: "ethics", lvl: "A", scen: "The opposing party is represented by another licensee, but your client urges you to phone that party directly to 'work it out.'",
        stem: "You should:", opts: ["Call the party directly to save time", "Communicate only through their representative, not directly with the represented party", "Refuse to communicate with anyone", "Email the party and just copy their representative"], ans: 1,
        src: "Paralegal Rules of Conduct, Rule 7 — Communication with a represented person", exp: "A paralegal must not communicate directly with a person known to be represented about the subject of the representation, except through their representative or with consent.",
        notes: ["Direct contact with a represented party is prohibited.", "Correct.", "You may still go through the representative.", "Even copied direct contact is improper without consent."] },
    { id: 202, area: "ethics", lvl: "X", scen: "A grateful client offers you a substantial personal gift at the end of the matter.",
        stem: "The prudent course is to:", opts: ["Accept any gift of any size", "Be cautious with substantial gifts and recommend the client get independent legal advice", "Ask for a gift", "Bill extra instead"], ans: 1,
        src: "Paralegal Rules of Conduct — Gifts / conflicts", exp: "A substantial gift can create a conflict; the paralegal should be cautious and ensure independent legal advice for significant benefits.",
        notes: ["Large gifts raise conflict concerns.", "Correct.", "Soliciting gifts is improper.", "Not the issue."] },
    { id: 203, area: "ethics", lvl: "A", stem: "A paralegal generally must not act against a former client:",
        opts: ["Ever, in any matter at all", "In the same or a related matter, or where the former client's confidential information could be used against them", "Only if the former client objects in writing", "Only within 30 days"], ans: 1,
        src: "Paralegal Rules of Conduct, Rule 3.04 — Former clients", exp: "Duties to a former client, especially confidentiality, bar acting against them in the same or a related matter or where their confidential information is relevant.",
        notes: ["Truly unrelated matters may be acceptable with safeguards.", "Correct.", "Not dependent on a written objection.", "No 30-day rule."] },
    { id: 204, area: "ethics", lvl: "X", scen: "A reporter asks you to comment on your client's ongoing, high-profile case.",
        stem: "You must:", opts: ["Share everything to win public sympathy", "Avoid statements that could prejudice a fair hearing or breach confidentiality", "Disclose your privileged strategy", "Speculate about the adjudicator"], ans: 1,
        src: "Paralegal Rules of Conduct, Rule 4 — Public statements", exp: "Public communications must not prejudice a fair hearing or breach confidentiality; restraint is required.",
        notes: ["Oversharing can prejudice the case.", "Correct.", "Privileged information must be protected.", "Disparaging the tribunal is improper."] },
    { id: 205, area: "ethics", lvl: "C", stem: "A non-licensee assistant in a paralegal's office may:",
        opts: ["Give legal advice to clients independently", "Perform delegated, supervised tasks but not provide legal services requiring a licensee", "Be the representative of record", "Conduct the trial"], ans: 1,
        src: "Paralegal Rules of Conduct — Delegation / unauthorized practice", exp: "Non-licensees can do delegated, supervised work, but providing legal services and advice requires a licensee.",
        notes: ["Non-licensees can't advise.", "Correct.", "Only the licensee acts as representative of record.", "Non-licensees can't conduct the matter."] },
    { id: 206, area: "ethics", lvl: "X", scen: "Before a hearing, your client tells you they intend to lie under oath.",
        stem: "You must:", opts: ["Help shape the false testimony", "Counsel against it, refuse to present evidence you know is false, and withdraw if necessary", "Let them testify and stay silent", "Tell the tribunal your client is a liar"], ans: 1,
        src: "Paralegal Rules of Conduct, Rule 4 — False evidence", exp: "A paralegal cannot knowingly present false evidence; counsel the client against perjury, and if they insist, the paralegal may have to withdraw.",
        notes: ["Assisting perjury is serious misconduct.", "Correct.", "Knowingly presenting perjury is prohibited.", "Publicly accusing the client breaches confidentiality."] },
    { id: 207, area: "ethics", lvl: "A", stem: "Honest billing requires a paralegal to:",
        opts: ["Round up by billing time not actually worked", "Charge only for work actually and reasonably done", "Add undisclosed fees", "Bill twice for the same task"], ans: 1,
        src: "Paralegal Rules of Conduct, Rule 5 — Fees", exp: "Fees must reflect work actually and reasonably performed; padding or fabricating time is dishonest.",
        notes: ["Padding is dishonest.", "Correct.", "Hidden fees are improper.", "Double-billing is improper."] },
    { id: 208, area: "ethics", lvl: "C", stem: "When acting for a close friend or family member, a paralegal:",
        opts: ["Owes fewer duties", "Still owes the full professional duties and must watch for personal-interest conflicts", "Need not keep records", "Can skip a retainer"], ans: 1,
        src: "Paralegal Rules of Conduct — duties / conflicts", exp: "Full professional obligations apply regardless of relationship, and personal interests can create conflicts to manage.",
        notes: ["Duties don't shrink.", "Correct.", "Records are still required.", "A retainer is still appropriate."] },
    { id: 209, area: "ethics", lvl: "X", scen: "A client invites you to invest jointly in the very business that is the subject of your retainer.",
        stem: "This presents:", opts: ["A great opportunity to take freely", "A conflict between your personal interest and your duty to the client; decline or insist on independent legal advice", "No issue at all", "A reason to raise fees"], ans: 1,
        src: "Paralegal Rules of Conduct, Rule 3.04 — Personal-interest conflict", exp: "A personal financial interest in the client's matter conflicts with loyalty; avoid it or insist on independent legal advice and full disclosure.",
        notes: ["Self-dealing endangers the client.", "Correct.", "It is a real conflict.", "Fees aren't the issue."] },
    { id: 210, area: "ethics", lvl: "A", stem: "When a client ends the retainer and asks for their file, the paralegal generally must:",
        opts: ["Destroy it", "Return the client's property/documents promptly, subject to any valid lien", "Keep it permanently as firm property", "Charge the client for their own documents"], ans: 1,
        src: "Paralegal Rules of Conduct — client property / withdrawal", exp: "On termination, the client is generally entitled to their file/property promptly, subject to any valid lien for fees.",
        notes: ["Destroying it is improper.", "Correct.", "Much of the file is the client's.", "The client's own documents belong to them."] },
    { id: 211, area: "ethics", lvl: "X", scen: "Partway through a matter you realize your services are being used to perpetrate a fraud.",
        stem: "You must:", opts: ["Keep going since you started", "Stop assisting and withdraw as required — you cannot continue to facilitate fraud", "Finish and bill for it", "Ask the client to be discreet"], ans: 1,
        src: "Paralegal Rules of Conduct — fraud / withdrawal", exp: "A paralegal must not continue to assist conduct known to be fraudulent; obligatory withdrawal may apply.",
        notes: ["Continuing facilitates fraud.", "Correct.", "Continuing is prohibited.", "Discretion doesn't cure it."] },
    { id: 212, area: "ethics", lvl: "C", stem: "The duty of competence is best described as:",
        opts: ["A one-time exam to pass", "An ongoing obligation to maintain and apply current knowledge and skill", "Optional after licensing", "Only about administrative speed"], ans: 1,
        src: "Paralegal Rules of Conduct, Rule 3.01 — Competence", exp: "Competence is continuing: licensees must keep knowledge and skills current (supported by CPD) and apply them diligently.",
        notes: ["Not one-time.", "Correct.", "It continues throughout practice.", "Far broader than that."] },
    /* ---- CIVIL ---- */
    { id: 213, area: "civil", lvl: "A", scen: "A client's potential claim has a basic 2-year limitation period that expires in three days.",

        src: "Limitations Act, 2002 — protecting the limitation", exp: "Missing a limitation period can bar the claim entirely and expose the representative to a negligence claim; issuing in time is critical.",
        notes: ["Premature and not protective.", "Correct.", "Waiting risks losing the claim.", "A demand letter doesn't stop the clock."] },
    { id: 214, area: "civil", lvl: "C", stem: "If a defendant believes a third person is actually responsible, the defendant may:",

        notes: ["Inaction may leave the defendant exposed.", "Correct.", "Wrong forum.", "No order to appeal yet."] },
    { id: 215, area: "civil", lvl: "A", scen: "You must serve a Plaintiff's Claim on a corporation.",

        src: "Rules of the Small Claims Court — service on a corporation", exp: "A corporation is generally served by leaving the document with an officer/director or at its place of business or registered office.",
        notes: ["Casual notice isn't valid service.", "Correct.", "Posting online isn't service.", "Service can be by various permitted means."] },
    { id: 216, area: "civil", lvl: "A", stem: "When garnishing a debtor's wages, the creditor should know that:",

        src: "Wages Act / enforcement", exp: "A statutory portion of wages is exempt from garnishment, so only part can be taken.",
        notes: ["Not all wages.", "Correct.", "Wages can be garnished, within limits.", "Statute and the order set the limits."] },
    { id: 217, area: "civil", lvl: "A", scen: "The parties signed Terms of Settlement, but the defendant fails to pay as agreed.",

        src: "Rules of the Small Claims Court — enforcing settlements", exp: "A signed settlement can usually be enforced by motion for judgment on its terms if breached.",
        notes: ["A new suit is usually unnecessary.", "Correct.", "Inaction forfeits the benefit.", "A settlement isn't appealed."] },
    { id: 218, area: "civil", lvl: "C", stem: "Quantifiable out-of-pocket losses (e.g., specific repair bills) are usually pleaded as:",

        notes: ["General damages are non-specific.", "Correct.", "Punitive damages are exceptional.", "Costs are separate from damages."] },
    { id: 219, area: "civil", lvl: "A", scen: "Your client's loss is about $40,000, but they want to stay in Small Claims Court.",

        src: "Courts of Justice Act — Small Claims jurisdiction", exp: "A plaintiff can abandon the portion exceeding $35,000 to keep the claim within Small Claims jurisdiction, giving up the excess.",
        notes: ["Exceeds the limit.", "Correct.", "Improperly splitting a claim isn't allowed.", "The court can't exceed its limit."] },
    { id: 220, area: "civil", lvl: "C", stem: "A successful party in Small Claims may generally recover reasonable:",

        src: "Rules of the Small Claims Court — costs", exp: "Reasonable disbursements (e.g., filing and service fees) are generally recoverable by the successful party.",
        notes: ["Not recoverable.", "Correct.", "Not recoverable.", "Some costs are recoverable."] },
    { id: 221, area: "civil", lvl: "A", scen: "A judgment debtor pays the judgment in full.",
        stem: "The creditor should:", opts: ["Keep enforcing anyway", "File a satisfaction so the judgment is recorded as paid", "Sue again for the same amount", "Ignore it"], ans: 1,
        src: "Rules of the Small Claims Court — satisfaction of judgment", exp: "When a judgment is paid, a satisfaction should be filed so the record reflects payment and enforcement stops.",

    { id: 222, area: "civil", lvl: "C", stem: "Compared with higher courts, the Small Claims Court's approach to evidence is:",

        notes: ["It is more relaxed.", "Correct.", "Not identical.", "Oral evidence is heard too."] },

    { id: 384, area: "admin", lvl: "C", prov: "SK", stem: "The time limit to file a Saskatchewan Human Rights Commission complaint is generally:", opts: ["6 months", "1 year", "2 years", "No limit"], ans: 1, src: "Saskatchewan Human Rights Code", exp: "SK human rights complaints must generally be filed within 1 year of the alleged discrimination.", notes: ["Too short.", "Correct.", "Too long.", "There is a time limit."] },
    { id: 385, area: "practice", lvl: "C", prov: "SK", stem: "Workers injured in Saskatchewan receive compensation through:", opts: ["The court system only", "The Workers' Compensation Board of Saskatchewan (WCB)", "Saskatchewan Health Authority", "Employment Insurance"], ans: 1, src: "The Workers' Compensation Act, 2013 (Saskatchewan)", exp: "WCB Saskatchewan administers the no-fault workplace injury compensation system.", notes: ["Barred by statute.", "Correct.", "Different mandate.", "Different program."] },
    { id: 386, area: "practice", lvl: "A", prov: "SK", stem: "Under Saskatchewan's workers' compensation system, a covered injured worker generally:", opts: ["Can sue their employer in court", "Cannot sue their employer but receives WCB compensation", "Chooses between WCB and court", "Gets nothing if at fault"], ans: 1, src: "The Workers' Compensation Act, 2013 (Saskatchewan)", exp: "SK's no-fault WCB system bars civil suits against employers for covered workplace injuries.", notes: ["Barred.", "Correct.", "No choice.", "No-fault."] },
    { id: 387, area: "poa", lvl: "C", prov: "SK", stem: "Traffic violations in Saskatchewan are governed by:", opts: ["The Criminal Code alone", "The Traffic Safety Act (Saskatchewan)", "The Federal Motor Vehicle Safety Act", "The Highway Traffic Act (Ontario)"], ans: 1, src: "Traffic Safety Act (Saskatchewan)", exp: "The Traffic Safety Act is Saskatchewan's provincial legislation governing road use and traffic offences.", notes: ["Federal criminal law is separate.", "Correct.", "Federal safety standards.", "Ontario legislation."] },
    { id: 388, area: "practice", lvl: "C", prov: "SK", stem: "Employment minimum standards in Saskatchewan are set by:", opts: ["The Canada Labour Code only", "The Saskatchewan Employment Act", "Common law only", "The Criminal Code"], ans: 1, src: "The Saskatchewan Employment Act (2014)", exp: "The Saskatchewan Employment Act sets minimum standards for wages, hours, vacations, and termination.", notes: ["Federal for federal employees only.", "Correct.", "The Act supplements common law.", "Wrong."] },
    { id: 389, area: "ethics", lvl: "C", prov: "SK", stem: "Interest on Saskatchewan lawyers' pooled trust accounts goes to:", opts: ["The lawyer", "The Law Foundation of Saskatchewan", "The provincial government", "The Law Society directly"], ans: 1, src: "Law Foundation of Saskatchewan Act", exp: "The Law Foundation of Saskatchewan receives pooled trust interest to fund legal aid and access to justice.", notes: ["Not permitted.", "Correct.", "Not a government fund.", "The LSS funds itself separately."] },
    { id: 390, area: "ethics", lvl: "A", prov: "SK", stem: "Unauthorized practice of law in Saskatchewan is prohibited under:", opts: ["Federal regulations", "The Legal Profession Act, 1990 (Saskatchewan)", "Only the common law", "Only civil liability applies"], ans: 1, src: "Legal Profession Act, 1990 (Saskatchewan)", exp: "The Legal Profession Act prohibits unauthorized legal practice and carries regulatory consequences.", notes: ["Provincial legislation governs.", "Correct.", "Statute addresses it directly.", "Has regulatory consequences."] },
    { id: 391, area: "ethics", lvl: "X", prov: "SK", scen: "A Saskatchewan lawyer realizes their personal financial interest conflicts with their client's.", stem: "They should:", opts: ["Continue and hope for the best", "Decline or withdraw and refer the client appropriately", "Charge a lower fee", "Disclose only if the client asks"], ans: 1, src: "Law Society of Saskatchewan — Code of Professional Conduct", exp: "A personal interest conflict that impairs judgment requires declining or withdrawing.", notes: ["Impaired judgment harms the client.", "Correct.", "The fee does not fix the conflict.", "Disclosure alone is insufficient."] },
    { id: 392, area: "civil", lvl: "A", prov: "SK", stem: "The Court of Appeal for Saskatchewan hears appeals from:", opts: ["The Provincial Court directly", "The Court of King's Bench of Saskatchewan", "The ORT directly", "The Federal Court"], ans: 1, src: "Court of Appeal Act, 2000 (Saskatchewan)", exp: "The Court of Appeal for Saskatchewan hears appeals from the Court of King's Bench.", notes: ["Provincial Court appeals go to King's Bench first.", "Correct.", "ORT decisions are reviewed by King's Bench.", "For federal matters."] },
    { id: 393, area: "ethics", lvl: "C", prov: "SK", stem: "A Saskatchewan lawyer's duty of confidentiality:", opts: ["Ends when the retainer ends", "Continues indefinitely, including after the client's death", "Lasts 5 years after the matter", "Applies only to written instructions"], ans: 1, src: "Law Society of Saskatchewan — Code of Professional Conduct", exp: "Confidentiality survives the retainer and the client's death.", notes: ["It survives.", "Correct.", "No expiry.", "All communications are covered."] },
    { id: 394, area: "admin", lvl: "C", prov: "SK", stem: "Saskatchewan human rights complaints unresolved by the Commission may be referred to:", opts: ["The Court of King's Bench", "The Saskatchewan Human Rights Tribunal for a formal hearing", "The ORT", "The WCB"], ans: 1, src: "Saskatchewan Human Rights Code", exp: "After investigation, matters not resolved may be referred to the Human Rights Tribunal for hearing.", notes: ["Not the court's first role.", "Correct.", "Different mandate.", "Different mandate."] },
    { id: 395, area: "admin", lvl: "A", prov: "SK", stem: "Judicial review of Saskatchewan administrative tribunal decisions is generally brought in:", opts: ["The Provincial Court", "The Court of King's Bench", "The Court of Appeal directly", "The Federal Court"], ans: 1, src: "Administrative Procedures Act (Saskatchewan)", exp: "Judicial review of provincial tribunal decisions in Saskatchewan is brought in the Court of King's Bench.", notes: ["No jurisdiction.", "Correct.", "Not the first step.", "For federal tribunals."] },
    { id: 396, area: "practice", lvl: "A", prov: "SK", scen: "A Saskatchewan employer terminates an employee of 3 years without notice or pay in lieu.", stem: "This most likely:", opts: ["Is always valid", "Violates minimum statutory notice requirements under the Saskatchewan Employment Act", "Is governed only by common law", "Requires only a letter"], ans: 1, src: "The Saskatchewan Employment Act (2014)", exp: "The SK Employment Act requires minimum notice scaled to length of service; 3 years entitles the worker to more than nothing.", notes: ["Statutory minimums apply.", "Correct.", "The Act supplements common law.", "A letter alone does not meet the obligation."] },
    { id: 397, area: "civil", lvl: "A", prov: "SK", stem: "A Saskatchewan plaintiff who obtains a judgment can enforce it through:", opts: ["No enforcement mechanisms exist", "Garnishment or seizure available under The Enforcement of Money Judgments Act", "Only the Provincial Court", "Filing in superior court first"], ans: 1, src: "The Enforcement of Money Judgments Act (Saskatchewan)", exp: "Saskatchewan's Enforcement of Money Judgments Act provides garnishment and seizure mechanisms.", notes: ["Enforcement mechanisms exist.", "Correct.", "Not limited to one court.", "Not required."] },
    { id: 398, area: "admin", lvl: "C", prov: "SK", stem: "The Saskatchewan Human Rights Code protects individuals from discrimination in areas such as:", opts: ["Employment only", "Employment, accommodation, and access to services and facilities", "Government services only", "Only private schools"], ans: 1, src: "Saskatchewan Human Rights Code", exp: "The Code prohibits discrimination in employment, accommodation, services and facilities, and other defined areas.", notes: ["Broader than employment.", "Correct.", "Broader than government.", "Much broader."] },
    { id: 399, area: "ethics", lvl: "A", prov: "SK", stem: "A Saskatchewan lawyer who discovers a trust shortfall must:", opts: ["Replace funds quietly", "Correct the shortfall and report as required under LSS rules", "Wait for the client to notice", "Attribute it to a banking error"], ans: 1, src: "Law Society of Saskatchewan — Code of Professional Conduct", exp: "Trust shortfalls must be corrected and reported; concealment is professional misconduct.", notes: ["Concealment is improper.", "Correct.", "Delay is improper.", "This compounds the breach."] },
    { id: 400, area: "poa", lvl: "A", prov: "SK", stem: "A Saskatchewan driver wishing to dispute a traffic ticket generally must:", opts: ["Simply not pay it", "Request a hearing or appear in court as indicated on the ticket", "Contact the issuing officer", "File with the Human Rights Commission"], ans: 1, src: "Traffic Safety Act / Summary Offences Procedure Act (Saskatchewan)", exp: "Traffic ticket disputes require requesting a hearing within the time stated on the ticket.", notes: ["Leads to default conviction.", "Correct.", "Not the mechanism.", "Wrong body."] },
    /* ============== MANITOBA — 25 QUESTIONS (401-425) ============== */
    { id: 401, area: "ethics", lvl: "C", prov: "MB", stem: "The legal regulator for lawyers in Manitoba is:", opts: ["The Law Society of Ontario", "The Law Society of Manitoba (LSM)", "The Manitoba Law Foundation", "The Manitoba Justice Department"], ans: 1, src: "Legal Profession Act (Manitoba)", exp: "The Law Society of Manitoba regulates the legal profession under the Legal Profession Act.", notes: ["Ontario regulator.", "Correct.", "Separate body.", "Government."] },
    { id: 402, area: "civil", lvl: "C", prov: "MB", stem: "Manitoba's superior court with unlimited civil jurisdiction is the:", opts: ["Manitoba Provincial Court", "Court of King's Bench (Manitoba)", "Manitoba Court of Appeal", "Small Claims Court"], ans: 1, src: "Court of King's Bench Act (Manitoba)", exp: "The Court of King's Bench is Manitoba's superior trial court.", notes: ["Limited jurisdiction.", "Correct.", "Appellate.", "Has monetary limits."] },
    { id: 403, area: "civil", lvl: "C", prov: "MB", stem: "Manitoba's basic limitation period under The Limitation of Actions Act is:", opts: ["1 year", "2 years", "6 years", "10 years"], ans: 1, src: "The Limitation of Actions Act (Manitoba)", exp: "Manitoba's Limitation of Actions Act provides a 2-year limitation period running from discoverability.", notes: ["Too short.", "Correct.", "Old limitation period.", "Too long."] },
    { id: 404, area: "admin", lvl: "C", prov: "MB", stem: "Residential tenancy disputes in Manitoba are resolved through:", opts: ["The Landlord and Tenant Board", "The Residential Tenancies Branch (Manitoba)", "The Manitoba Human Rights Commission", "The Court of King's Bench only"], ans: 1, src: "The Residential Tenancies Act (Manitoba)", exp: "The Residential Tenancies Branch administers The Residential Tenancies Act and resolves landlord-tenant disputes.", notes: ["Ontario body.", "Correct.", "Different mandate.", "The Branch handles disputes first."] },
    { id: 405, area: "admin", lvl: "A", prov: "MB", stem: "To evict a Manitoba tenant for non-payment of rent, a landlord must first give:", opts: ["24-hour notice", "5 days written notice", "14 days written notice", "One month notice"], ans: 1, src: "The Residential Tenancies Act (Manitoba)", exp: "A Manitoba landlord must give at least 5 days written notice to terminate for non-payment of rent.", notes: ["Not a recognised notice period.", "Correct.", "That is Ontario's period.", "Too long for non-payment."] },
    { id: 406, area: "admin", lvl: "C", prov: "MB", stem: "Unresolved Manitoba human rights complaints are referred to:", opts: ["The Court of King's Bench directly", "The Human Rights Adjudication Panel", "The Attorney General", "The Residential Tenancies Branch"], ans: 1, src: "The Human Rights Code (Manitoba)", exp: "After investigation, unresolved MB human rights complaints go to the Human Rights Adjudication Panel for a formal hearing.", notes: ["Not the court's first role.", "Correct.", "Wrong body.", "Wrong body."] },
    { id: 407, area: "admin", lvl: "C", prov: "MB", stem: "The time limit to file a Manitoba Human Rights Commission complaint is:", opts: ["6 months", "1 year", "2 years", "No limit"], ans: 1, src: "The Human Rights Code (Manitoba)", exp: "Manitoba human rights complaints must be filed within 1 year of the alleged act.", notes: ["Too short.", "Correct.", "Too long.", "There is a limit."] },
    { id: 408, area: "practice", lvl: "C", prov: "MB", stem: "Workers injured in Manitoba receive compensation through:", opts: ["The court system", "The Workers Compensation Board of Manitoba (WCB)", "Manitoba Health", "Employment Insurance"], ans: 1, src: "The Workers Compensation Act (Manitoba)", exp: "WCB Manitoba administers the no-fault workplace injury compensation system.", notes: ["Barred by statute.", "Correct.", "Different mandate.", "Different program."] },
    { id: 409, area: "practice", lvl: "A", prov: "MB", stem: "Under Manitoba's workers' compensation system, a covered injured worker:", opts: ["Can sue their employer", "Cannot sue their employer but receives WCB compensation", "Chooses between WCB and court", "Gets nothing if partly at fault"], ans: 1, src: "The Workers Compensation Act (Manitoba)", exp: "Manitoba's no-fault WCB system bars civil suits against employers for covered workplace injuries.", notes: ["Barred.", "Correct.", "No choice.", "No-fault."] },
    { id: 410, area: "poa", lvl: "C", prov: "MB", stem: "Traffic violations in Manitoba are governed by:", opts: ["The Criminal Code only", "The Highway Traffic Act (Manitoba)", "Federal regulations only", "The Employment Standards Code"], ans: 1, src: "Highway Traffic Act (Manitoba)", exp: "The Highway Traffic Act is Manitoba's provincial statute governing road use and traffic offences.", notes: ["Federal criminal law governs criminal driving.", "Correct.", "Federal standards are separate.", "Wrong."] },
    { id: 411, area: "practice", lvl: "C", prov: "MB", stem: "Employment minimum standards in Manitoba are set by:", opts: ["The Canada Labour Code only", "The Employment Standards Code (Manitoba)", "Common law only", "The Criminal Code"], ans: 1, src: "The Employment Standards Code (Manitoba)", exp: "Manitoba's Employment Standards Code sets minimum standards for wages, hours, vacation, and termination.", notes: ["Federal for federal employees.", "Correct.", "The Code supplements common law.", "Wrong."] },
    { id: 412, area: "ethics", lvl: "C", prov: "MB", stem: "Interest on Manitoba lawyers' pooled trust accounts is paid to:", opts: ["The lawyer", "The Manitoba Law Foundation", "The provincial government", "The Law Society directly"], ans: 1, src: "Manitoba Law Foundation / Law Society of Manitoba — trust accounting", exp: "Trust interest in Manitoba is remitted to the Manitoba Law Foundation to fund legal aid and access to justice.", notes: ["Not permitted.", "Correct.", "Not a government fund.", "The LSM funds itself separately."] },
    { id: 413, area: "admin", lvl: "A", prov: "MB", stem: "Judicial review of Manitoba administrative tribunal decisions is brought in:", opts: ["Manitoba Provincial Court", "The Court of King's Bench (Manitoba)", "The Manitoba Court of Appeal directly", "The Federal Court"], ans: 1, src: "Administrative Procedures Act (Manitoba)", exp: "Judicial review of provincial tribunal decisions in Manitoba is brought in the Court of King's Bench.", notes: ["No jurisdiction.", "Correct.", "Not the first step.", "For federal tribunals."] },
    { id: 414, area: "admin", lvl: "C", prov: "MB", stem: "The Manitoba Human Rights Code prohibits discrimination in areas including:", opts: ["Employment only", "Employment, accommodation, and services", "Government services only", "Only schools"], ans: 1, src: "The Human Rights Code (Manitoba)", exp: "The Manitoba Human Rights Code prohibits discrimination in employment, accommodation, and services, among other areas.", notes: ["Broader.", "Correct.", "Broader.", "Much broader."] },
    { id: 415, area: "ethics", lvl: "C", prov: "MB", stem: "The Law Society of Manitoba is empowered under the:", opts: ["Federal Law Society Act", "Legal Profession Act (Manitoba)", "Manitoba Justice Act", "The Canadian Bar Act"], ans: 1, src: "Legal Profession Act (Manitoba)", exp: "The Law Society of Manitoba is created and empowered under the Legal Profession Act.", notes: ["No federal law society act.", "Correct.", "No such act.", "No such act."] },
    { id: 416, area: "civil", lvl: "A", prov: "MB", stem: "A Manitoba plaintiff who fails to commence an action within the limitation period:", opts: ["Gets one extra year automatically", "Loses the right to sue as the claim is statute-barred", "Can still sue if the defendant doesn't raise it", "Can apply for unlimited extensions"], ans: 1, src: "The Limitation of Actions Act (Manitoba)", exp: "A limitation-barred claim cannot be brought; if raised, expiry is a complete defence.", notes: ["No automatic extension.", "Correct.", "If raised, it is a complete defence.", "No such automatic right."] },
    { id: 417, area: "ethics", lvl: "X", prov: "MB", scen: "A Manitoba lawyer acts for both parties in a real estate transaction without disclosure or consent.", stem: "This is most likely:", opts: ["Efficient and acceptable", "A conflict of interest requiring disclosure and consent or withdrawal", "Fine if both parties are satisfied", "A matter for the judge"], ans: 1, src: "Law Society of Manitoba — Code of Professional Conduct", exp: "Acting for multiple parties without disclosure and consent is a conflict of interest; proper steps are required.", notes: ["Not acceptable.", "Correct.", "Client satisfaction does not waive the rules.", "It is a professional conduct matter."] },
    { id: 418, area: "ethics", lvl: "A", prov: "MB", stem: "A Manitoba lawyer who discovers a trust shortfall must:", opts: ["Cover it and say nothing", "Correct the shortfall and report as required under LSM rules", "Wait for the client to complain", "Blame the bookkeeper"], ans: 1, src: "Law Society of Manitoba — Code of Professional Conduct", exp: "Trust shortfalls must be corrected and reported; concealment is professional misconduct.", notes: ["Concealment is improper.", "Correct.", "Delay is improper.", "Blame-shifting does not address the breach."] },
    { id: 419, area: "admin", lvl: "A", prov: "MB", stem: "A Manitoba tenant who receives a notice to vacate and wants to dispute it should:", opts: ["Simply ignore it", "Apply to the Residential Tenancies Branch within the prescribed time", "Apply to the Human Rights Commission", "File in the Court of King's Bench directly"], ans: 1, src: "The Residential Tenancies Act (Manitoba)", exp: "Tenants disputing notices must apply to the Residential Tenancies Branch within the applicable time.", notes: ["Ignoring may result in eviction.", "Correct.", "Different body.", "The Branch is the first forum."] },
    { id: 420, area: "practice", lvl: "C", prov: "MB", stem: "Unauthorized practice of law in Manitoba is prohibited under:", opts: ["The Federal Law Society Act", "The Legal Profession Act (Manitoba)", "Only civil liability rules", "Common law only"], ans: 1, src: "Legal Profession Act (Manitoba)", exp: "The Legal Profession Act prohibits unauthorized legal practice in Manitoba.", notes: ["Provincial legislation governs.", "Correct.", "Has regulatory consequences.", "Statute governs."] },
    { id: 421, area: "civil", lvl: "C", prov: "MB", stem: "Appeals from the Court of King's Bench of Manitoba lie to:", opts: ["The Manitoba Provincial Court", "The Manitoba Court of Appeal", "The Federal Court of Appeal", "The Supreme Court of Canada directly"], ans: 1, src: "Court of Appeal Act (Manitoba)", exp: "The Manitoba Court of Appeal hears appeals from Court of King's Bench decisions.", notes: ["Provincial Court appeals go to King's Bench first.", "Correct.", "Federal matters only.", "Not the first appeal level."] },
    { id: 422, area: "poa", lvl: "A", prov: "MB", stem: "A Manitoba driver ticketed for speeding who wants to dispute it must:", opts: ["Not pay the ticket", "Request a hearing within the time specified on the ticket", "Contact the Manitoba Human Rights Commission", "File in the Court of King's Bench only"], ans: 1, src: "Highway Traffic Act / Summary Convictions Act (Manitoba)", exp: "Disputing a Manitoba traffic ticket requires requesting a hearing within the time indicated on the ticket.", notes: ["Leads to default conviction.", "Correct.", "Wrong body.", "Not the correct forum."] },
    { id: 423, area: "admin", lvl: "C", prov: "MB", stem: "Manitoba's workers' compensation bar means a covered worker:", opts: ["Can never recover any compensation", "Cannot sue their employer in court but receives no-fault WCB benefits instead", "Must choose within 30 days", "Only severe injuries are covered"], ans: 1, src: "The Workers Compensation Act (Manitoba)", exp: "The no-fault bar prevents civil suits against employers but provides compensation through WCB for covered injuries.", notes: ["WCB provides compensation.", "Correct.", "No such choice deadline.", "Coverage is broad."] },
    { id: 424, area: "ethics", lvl: "C", prov: "MB", stem: "A Manitoba lawyer's duty of confidentiality:", opts: ["Ends when the retainer ends", "Continues after the retainer ends and after the client's death", "Lasts 7 years", "Applies only to court matters"], ans: 1, src: "Law Society of Manitoba — Code of Professional Conduct", exp: "Confidentiality is ongoing — it survives the retainer and the client's death.", notes: ["It survives.", "Correct.", "No expiry.", "All matters are covered."] },
    { id: 425, area: "practice", lvl: "A", prov: "MB", stem: "The Employment Standards Code (Manitoba) applies to:", opts: ["Federally regulated workers only", "Most non-unionized Manitoba employees", "Only full-time workers", "Only the resource sector"], ans: 1, src: "The Employment Standards Code (Manitoba)", exp: "The Code covers most non-unionized Manitoba employees; federally regulated workers fall under the Canada Labour Code.", notes: ["Federal employees are governed federally.", "Correct.", "Part-time workers are also covered.", "All industries."] },
    /* ============== QUEBEC — 25 QUESTIONS (426-450) ============== */
    { id: 426, area: "ethics", lvl: "C", prov: "QC", stem: "Lawyers (advocates) in Quebec are regulated by:", opts: ["The Law Society of Ontario", "The Barreau du Quebec", "The Chambre des notaires", "The Quebec Justice Department"], ans: 1, src: "Act Respecting the Barreau du Quebec", exp: "The Barreau du Quebec regulates advocates (lawyers) in Quebec.", notes: ["Ontario regulator.", "Correct.", "Notaries are separate.", "Government."] },
    { id: 427, area: "ethics", lvl: "C", prov: "QC", stem: "Notaries in Quebec are regulated by:", opts: ["The Barreau du Quebec", "The Chambre des notaires du Quebec", "The Federal Notary Act", "The Code des professions only"], ans: 1, src: "Notaries Act (Quebec) / Code des professions", exp: "The Chambre des notaires du Quebec regulates Quebec notaries, who have a broader scope than notaries in other provinces.", notes: ["Barreau regulates lawyers.", "Correct.", "No such federal act.", "The Code provides the framework."] },
    { id: 428, area: "civil", lvl: "C", prov: "QC", stem: "Quebec's private law — contracts, property, obligations — is governed primarily by:", opts: ["The common law", "The Civil Code of Quebec (CCQ)", "The Criminal Code", "The Federal Civil Code"], ans: 1, src: "Civil Code of Quebec (CCQ)", exp: "Quebec's private law is based on the Civil Code of Quebec, not the common law used in other provinces.", notes: ["Quebec uses civil law, not common law, for private matters.", "Correct.", "Federal criminal law.", "No such federal civil code."] },
    { id: 429, area: "civil", lvl: "C", prov: "QC", stem: "Quebec's Small Claims Division handles claims up to:", opts: ["$7,000", "$10,000", "$15,000", "$25,000"], ans: 2, src: "Code of Civil Procedure (Quebec) — Division des petites creances", exp: "Quebec's Small Claims Division handles claims up to $15,000.", notes: ["Old limit.", "Too low.", "Correct.", "Exceeds the limit."] },
    { id: 430, area: "civil", lvl: "C", prov: "QC", stem: "Civil procedure in Quebec is governed by the:", opts: ["Rules of Civil Procedure (Ontario)", "Code of Civil Procedure (Code de procedure civile)", "Federal Rules of Civil Procedure", "Common law only"], ans: 1, src: "Code of Civil Procedure (Quebec)", exp: "Quebec's Code of Civil Procedure governs civil proceedings in Quebec courts.", notes: ["Ontario rules.", "Correct.", "No such federal code.", "Quebec uses a codified system."] },
    { id: 431, area: "civil", lvl: "C", prov: "QC", stem: "Quebec's superior court with general civil jurisdiction is the:", opts: ["Court of Quebec", "Superior Court of Quebec (Cour superieure)", "Court of Appeal of Quebec", "Small Claims Division"], ans: 1, src: "Courts of Justice Act (Quebec)", exp: "The Superior Court of Quebec is the province's superior trial court with inherent and general jurisdiction.", notes: ["Court of Quebec has limited jurisdiction.", "Correct.", "Appellate court.", "Has monetary limits."] },
    { id: 432, area: "admin", lvl: "C", prov: "QC", stem: "Residential tenancy disputes in Quebec are resolved by:", opts: ["The Landlord and Tenant Board", "The Tribunal administratif du logement (TAL)", "The Commission des droits de la personne", "The Superior Court only"], ans: 1, src: "Act Respecting the Administrative Housing Tribunal (Quebec)", exp: "The TAL (formerly the Regie du logement) adjudicates residential tenancy disputes in Quebec.", notes: ["Ontario body.", "Correct.", "Human rights body.", "The TAL is the first forum."] },
    { id: 433, area: "admin", lvl: "A", prov: "QC", stem: "Quebec's human rights complaints are investigated by:", opts: ["The Barreau du Quebec", "The Commission des droits de la personne et des droits de la jeunesse (CDPDJ)", "The TAL", "The CNESST"], ans: 1, src: "Charter of Human Rights and Freedoms (Quebec)", exp: "The CDPDJ investigates human rights complaints under Quebec's Charter of Human Rights and Freedoms.", notes: ["Legal regulator.", "Correct.", "Residential tenancy tribunal.", "Labour/workers comp body."] },
    { id: 434, area: "admin", lvl: "C", prov: "QC", stem: "Quebec's workplace health/safety AND labour standards are both administered by:", opts: ["Two separate bodies", "The CNESST", "The CDPDJ", "The TAL"], ans: 1, src: "An Act Respecting the CNESST (Quebec)", exp: "The CNESST uniquely handles both labour standards AND workplace health, safety, and injury compensation — a merged body unique in Canada.", notes: ["They are merged in the CNESST.", "Correct.", "Human rights body.", "Residential tenancy tribunal."] },
    { id: 435, area: "admin", lvl: "A", prov: "QC", stem: "Workers injured at work in Quebec receive compensation through:", opts: ["The court system", "The CNESST under the Act Respecting Industrial Accidents and Occupational Diseases (LATMP)", "Quebec Health Insurance (RAMQ)", "Employment Insurance"], ans: 1, src: "Act Respecting Industrial Accidents and Occupational Diseases (Quebec)", exp: "Injured workers in Quebec receive no-fault compensation through the CNESST under the LATMP; civil suits against employers are barred.", notes: ["Civil suits are barred.", "Correct.", "Different program.", "Different program."] },
    { id: 436, area: "admin", lvl: "C", prov: "QC", stem: "Quebec's Charter of Human Rights and Freedoms differs from the Canadian Charter because it:", opts: ["Is identical to the Canadian Charter", "Has quasi-constitutional status and applies to private relations as well as government", "Only applies to government actions", "Is a federal document"], ans: 1, src: "Charter of Human Rights and Freedoms (Quebec)", exp: "Quebec's Charter has quasi-constitutional status and applies to both government and private actors — unlike the federal Charter which binds only government.", notes: ["It is distinct and broader in some ways.", "Correct.", "It applies to private relations too.", "It is Quebec legislation."] },
    { id: 437, area: "ethics", lvl: "C", prov: "QC", stem: "In Quebec, a notary's scope of practice includes:", opts: ["Only witnessing signatures", "Drafting authenticated instruments and handling uncontested matters such as real estate, wills, and family law", "Only criminal defence", "Only court appearances"], ans: 1, src: "Notaries Act (Quebec)", exp: "Quebec notaries have broad scope including drafting notarial acts and handling non-contentious estates, real estate, and family matters.", notes: ["Notaries do much more.", "Correct.", "Notaries do not do criminal defence.", "Notaries generally handle non-contentious matters."] },
    { id: 438, area: "civil", lvl: "C", prov: "QC", stem: "Quebec's general prescription (limitation) period for most personal actions under the Civil Code is:", opts: ["1 year", "2 years", "3 years", "10 years"], ans: 2, src: "Civil Code of Quebec, art. 2925", exp: "The general prescription period in Quebec for most personal actions is 3 years — different from the 2-year period in most common law provinces.", notes: ["Too short.", "Most common law provinces use 2 years.", "Correct.", "Too long."] },
    { id: 439, area: "ethics", lvl: "A", prov: "QC", stem: "Professional conduct of Quebec lawyers is governed by the:", opts: ["Rules of Professional Conduct (Ontario)", "Code of Professional Conduct of the Barreau du Quebec", "Federal Legal Ethics Code", "Civil Code only"], ans: 1, src: "Barreau du Quebec — Code of Professional Conduct", exp: "The Barreau du Quebec's Code of Professional Conduct sets ethics standards for Quebec lawyers.", notes: ["Ontario rules.", "Correct.", "No such federal code.", "The Civil Code governs private law, not professional conduct."] },
    { id: 440, area: "ethics", lvl: "C", prov: "QC", stem: "All Quebec professions — including law and notaries — operate under the umbrella of:", opts: ["The Federal Professional Standards Act", "The Professional Code (Code des professions)", "The Civil Code alone", "The Criminal Code"], ans: 1, src: "Professional Code (Code des professions) (Quebec)", exp: "The Professional Code provides the general framework for all professional orders in Quebec, including the Barreau and Chambre des notaires.", notes: ["No such federal act.", "Correct.", "The Civil Code governs private law.", "Federal criminal law."] },
    { id: 441, area: "civil", lvl: "A", prov: "QC", stem: "The obligation to act in good faith in Quebec contractual relations is found in:", opts: ["The common law only", "The Civil Code of Quebec — parties must act in good faith at all stages of the contract", "The Criminal Code", "Only judge-made law"], ans: 1, src: "Civil Code of Quebec, art. 1375", exp: "The CCQ expressly requires parties to conduct themselves in good faith throughout negotiations, performance, and dissolution of contracts.", notes: ["Quebec does not use common law for private matters.", "Correct.", "Criminal law.", "The CCQ codifies this principle."] },
    { id: 442, area: "admin", lvl: "C", prov: "QC", stem: "The CDPDJ processes human rights complaints by:", opts: ["Sending them directly to the Tribunal des droits de la personne without investigation", "Investigating and attempting resolution; unresolved matters may go to the Tribunal des droits de la personne", "Referring all complaints to the Barreau", "Sending complaints to the TAL"], ans: 1, src: "Charter of Human Rights and Freedoms (Quebec)", exp: "The CDPDJ investigates and attempts to resolve complaints; if unsuccessful, the matter can go to the Tribunal des droits de la personne.", notes: ["Not directly to Tribunal.", "Correct.", "Wrong body.", "Wrong body."] },
    { id: 443, area: "poa", lvl: "C", prov: "QC", stem: "Traffic offences in Quebec are governed by the:", opts: ["Criminal Code alone", "Highway Safety Code (Code de la securite routiere)", "Federal Motor Vehicle Safety Act", "Highway Traffic Act (Ontario)"], ans: 1, src: "Highway Safety Code (Quebec)", exp: "The Highway Safety Code is Quebec's provincial legislation governing road use and traffic offences.", notes: ["Federal criminal law is separate.", "Correct.", "Federal safety standards.", "Ontario legislation."] },
    { id: 444, area: "practice", lvl: "C", prov: "QC", stem: "Labour standards in Quebec (minimum wage, termination notice, etc.) are enforced by:", opts: ["The Canada Labour Code alone", "The CNESST under the Act Respecting Labour Standards", "The CDPDJ", "The TAL"], ans: 1, src: "Act Respecting Labour Standards (Quebec)", exp: "The CNESST enforces Quebec's labour standards under the Act Respecting Labour Standards.", notes: ["Federal for federally regulated employees.", "Correct.", "Human rights body.", "Residential tenancy."] },
    { id: 445, area: "civil", lvl: "A", prov: "QC", stem: "In Quebec's Small Claims Division, parties generally:", opts: ["Must be represented by a lawyer", "Represent themselves — lawyer representation is restricted to keep proceedings accessible", "Can choose any representative freely", "Must be represented by a notary"], ans: 1, src: "Code of Civil Procedure (Quebec) — Division des petites creances", exp: "Lawyer representation is restricted in the Small Claims Division; parties typically self-represent.", notes: ["Self-representation is the norm.", "Correct.", "Representation is restricted.", "Notaries are not advocates in court."] },
    { id: 446, area: "admin", lvl: "A", prov: "QC", scen: "A Quebec employer refuses to hire a qualified applicant because of their ethnic origin.", stem: "This violates:", opts: ["Only the federal Charter", "The Quebec Charter of Human Rights and Freedoms — discrimination in employment on a prohibited ground", "Only the Civil Code", "No law"], ans: 1, src: "Charter of Human Rights and Freedoms (Quebec)", exp: "The Quebec Charter prohibits discrimination in employment on prohibited grounds including ethnic origin; it applies to private employers.", notes: ["The Quebec Charter applies to private actors too.", "Correct.", "The Civil Code does not directly cover this.", "It is prohibited."] },
    { id: 447, area: "civil", lvl: "C", prov: "QC", stem: "Quebec's Court of Appeal hears appeals from:", opts: ["The TAL directly", "The Superior Court and on specified matters the Court of Quebec", "The CDPDJ directly", "The CNESST directly"], ans: 1, src: "Courts of Justice Act (Quebec)", exp: "The Quebec Court of Appeal hears appeals from the Superior Court and in certain cases from the Court of Quebec.", notes: ["TAL decisions go to Superior Court for review.", "Correct.", "CDPDJ is not a court.", "CNESST decisions go to review bodies."] },
    { id: 448, area: "ethics", lvl: "X", prov: "QC", scen: "A Quebec lawyer represents both buyer and seller in a contentious real estate transaction.", stem: "This is:", opts: ["Common and acceptable", "A potential conflict of interest that requires careful disclosure and may be prohibited", "Required for efficiency", "Subject to no professional rules"], ans: 1, src: "Barreau du Quebec — Code of Professional Conduct", exp: "Dual representation in contentious transactions is a conflict; even with disclosure, it may be prohibited under Quebec's professional conduct rules.", notes: ["Professional restrictions apply.", "Correct.", "Not required.", "Professional rules apply."] },
    { id: 449, area: "admin", lvl: "C", prov: "QC", stem: "Quebec's Tribunal administratif du logement (TAL) was formerly known as:", opts: ["The Landlord and Tenant Board", "La Regie du logement", "The Office de la protection du consommateur", "The CDPDJ"], ans: 1, src: "Act Respecting the Administrative Housing Tribunal (Quebec)", exp: "The TAL replaced the Regie du logement around 2020; it continues the same residential tenancy dispute resolution function.", notes: ["Ontario body.", "Correct.", "Consumer protection body.", "Human rights body."] },
    { id: 450, area: "ethics", lvl: "C", prov: "QC", stem: "The Charter of the French Language (Loi 101) affects Quebec legal professionals by:", opts: ["Requiring all legal services to be in English only", "Making French the normal language of civil and commercial life, with language rights that legal professionals must respect", "Imposing no specific obligations on legal professionals", "Requiring all contracts to be in French only"], ans: 1, src: "Charter of the French Language (Quebec)", exp: "Bill 101 establishes French as the official language of Quebec civil and commercial life; legal professionals must respect parties' language rights.", notes: ["French is the primary language.", "Correct.", "It does impose obligations.", "Contracts can be in other languages if parties agree."] },
    /* ============== NEW BRUNSWICK — 20 QUESTIONS (451-470) ============== */
    { id: 451, area: "ethics", lvl: "C", prov: "NB", stem: "Lawyers in New Brunswick are regulated by:", opts: ["The Law Society of Ontario", "The Law Society of New Brunswick (Barreau du Nouveau-Brunswick)", "The NB Justice Department", "The Canadian Bar Association"], ans: 1, src: "Law Society Act 1996 (New Brunswick)", exp: "The Law Society of New Brunswick, a bilingual body, regulates lawyers in New Brunswick.", notes: ["Ontario regulator.", "Correct.", "Government.", "Advisory body."] },
    { id: 452, area: "civil", lvl: "C", prov: "NB", stem: "New Brunswick's superior court is the:", opts: ["NB Provincial Court", "Court of King's Bench of New Brunswick", "NB Court of Appeal", "Small Claims Court"], ans: 1, src: "Judicature Act (New Brunswick)", exp: "The Court of King's Bench is New Brunswick's superior trial court.", notes: ["Limited jurisdiction.", "Correct.", "Appellate.", "Has monetary limits."] },
    { id: 453, area: "civil", lvl: "C", prov: "NB", stem: "New Brunswick's Small Claims Act allows claims up to:", opts: ["$10,000", "$15,000", "$20,000", "$30,000"], ans: 2, src: "Small Claims Act (New Brunswick)", exp: "NB's Small Claims Act handles civil claims up to $20,000.", notes: ["Too low.", "Too low.", "Correct.", "Exceeds the limit."] },
    { id: 454, area: "civil", lvl: "C", prov: "NB", stem: "NB's Limitation of Actions Act provides a basic limitation period of:", opts: ["1 year", "2 years", "6 years", "10 years"], ans: 1, src: "Limitation of Actions Act (New Brunswick)", exp: "New Brunswick's Limitation of Actions Act provides a 2-year basic limitation period.", notes: ["Too short.", "Correct.", "Old period.", "Too long."] },
    { id: 455, area: "admin", lvl: "C", prov: "NB", stem: "Residential tenancy disputes in New Brunswick are resolved through:", opts: ["The Landlord and Tenant Board", "The Residential Tenancies Tribunal (NB)", "The NB Human Rights Commission", "The Court of King's Bench only"], ans: 1, src: "Residential Tenancies Act (New Brunswick)", exp: "New Brunswick's Residential Tenancies Tribunal resolves disputes between landlords and tenants.", notes: ["Ontario body.", "Correct.", "Different mandate.", "The Tribunal is the first forum."] },
    { id: 456, area: "admin", lvl: "C", prov: "NB", stem: "New Brunswick's Human Rights Commission processes complaints under the:", opts: ["Canadian Charter only", "Human Rights Act (New Brunswick)", "Employment Standards Act only", "Residential Tenancies Act"], ans: 1, src: "Human Rights Act (New Brunswick)", exp: "NB's Human Rights Commission processes complaints under the Human Rights Act.", notes: ["The provincial statute applies to private actors.", "Correct.", "Different legislation.", "Wrong."] },
    { id: 457, area: "admin", lvl: "C", prov: "NB", stem: "The time limit to file a New Brunswick Human Rights Commission complaint is generally:", opts: ["6 months", "1 year", "2 years", "No limit"], ans: 1, src: "Human Rights Act (New Brunswick)", exp: "NB human rights complaints must generally be filed within 1 year of the alleged act.", notes: ["Too short.", "Correct.", "Too long.", "There is a limit."] },
    { id: 458, area: "practice", lvl: "C", prov: "NB", stem: "Workers injured in New Brunswick are compensated by:", opts: ["The court system only", "WorkSafeNB (the Workers' Compensation Board)", "New Brunswick Health", "Employment Insurance"], ans: 1, src: "Workers' Compensation Act (New Brunswick)", exp: "WorkSafeNB administers New Brunswick's no-fault workplace injury compensation system.", notes: ["Civil suits are barred.", "Correct.", "Different mandate.", "Different program."] },
    { id: 459, area: "poa", lvl: "C", prov: "NB", stem: "Traffic offences in New Brunswick are governed by the:", opts: ["Criminal Code alone", "Motor Vehicle Act (New Brunswick)", "Federal Motor Vehicle Safety Act", "Highway Traffic Act (Ontario)"], ans: 1, src: "Motor Vehicle Act (New Brunswick)", exp: "The Motor Vehicle Act is NB's provincial legislation governing road use and traffic offences.", notes: ["Federal criminal law is separate.", "Correct.", "Federal standards.", "Ontario legislation."] },
    { id: 460, area: "practice", lvl: "C", prov: "NB", stem: "Employment minimum standards in New Brunswick are set by:", opts: ["The Canada Labour Code only", "The Employment Standards Act (New Brunswick)", "Common law only", "The Criminal Code"], ans: 1, src: "Employment Standards Act (New Brunswick)", exp: "NB's Employment Standards Act sets minimum standards for wages, hours, vacation, and termination.", notes: ["Federal for federally regulated.", "Correct.", "The Act supplements common law.", "Wrong."] },
    { id: 461, area: "ethics", lvl: "A", prov: "NB", stem: "A New Brunswick lawyer's duty of confidentiality:", opts: ["Ends when the matter ends", "Continues indefinitely after the retainer and after the client's death", "Lasts only 7 years", "Applies only to documents"], ans: 1, src: "Law Society of New Brunswick — Code of Professional Conduct", exp: "Confidentiality continues after the retainer ends and after the client's death.", notes: ["It survives.", "Correct.", "No expiry.", "All communications are covered."] },
    { id: 462, area: "civil", lvl: "A", prov: "NB", stem: "Appeals from the New Brunswick Court of King's Bench lie to:", opts: ["The NB Provincial Court", "The Court of Appeal of New Brunswick", "The Federal Court", "The Supreme Court of Canada directly"], ans: 1, src: "Judicature Act (New Brunswick)", exp: "The Court of Appeal of New Brunswick hears appeals from the Court of King's Bench.", notes: ["Provincial Court appeals go to King's Bench first.", "Correct.", "Federal matters.", "Not the first appeal level."] },
    { id: 463, area: "ethics", lvl: "C", prov: "NB", stem: "Interest on New Brunswick lawyers' pooled trust accounts is paid to:", opts: ["The lawyer", "The Law Foundation of New Brunswick", "The provincial government", "The Law Society directly"], ans: 1, src: "Law Foundation Act (New Brunswick)", exp: "The Law Foundation of New Brunswick receives trust interest to fund legal education and access to justice.", notes: ["Not permitted.", "Correct.", "Not a government fund.", "The Law Society funds itself separately."] },
    { id: 464, area: "admin", lvl: "A", prov: "NB", stem: "Judicial review of New Brunswick administrative decisions is brought in:", opts: ["NB Provincial Court", "The Court of King's Bench of NB", "The Court of Appeal directly", "The Federal Court"], ans: 1, src: "Judicature Act / Judicial Review Act (NB)", exp: "Judicial review of provincial administrative decisions in NB is brought in the Court of King's Bench.", notes: ["No jurisdiction.", "Correct.", "Not the first step.", "For federal matters."] },
    { id: 465, area: "admin", lvl: "C", prov: "NB", stem: "New Brunswick's Human Rights Act prohibits discrimination in areas including:", opts: ["Employment only", "Employment, accommodation, and services", "Government services only", "Only private matters"], ans: 1, src: "Human Rights Act (New Brunswick)", exp: "NB's Human Rights Act prohibits discrimination in employment, accommodation, and services, among other areas.", notes: ["Broader.", "Correct.", "Broader.", "It covers defined social areas."] },
    { id: 466, area: "practice", lvl: "A", prov: "NB", stem: "An NB employer who dismisses a worker without adequate notice or pay in lieu:", opts: ["Is never liable", "May face a claim under the Employment Standards Act and/or common law", "Is only subject to the Criminal Code", "Must pay 3 months automatically"], ans: 1, src: "Employment Standards Act (New Brunswick)", exp: "Dismissal without adequate notice can attract claims under the ESA for statutory notice and under common law for reasonable notice.", notes: ["There is liability.", "Correct.", "Not a criminal matter.", "The amount depends on service and common law."] },
    { id: 467, area: "ethics", lvl: "X", prov: "NB", scen: "A New Brunswick lawyer discovers a conflict of interest mid-file.", stem: "They should:", opts: ["Continue and disclose to no one", "Disclose the conflict and consider withdrawing", "Charge a lower fee", "Continue if the client seems unaware"], ans: 1, src: "Law Society of New Brunswick — Code of Professional Conduct", exp: "A conflict discovered mid-file must be disclosed; withdrawal is likely necessary unless informed consent resolves it.", notes: ["Non-disclosure is improper.", "Correct.", "The fee does not fix the conflict.", "Client awareness does not waive the conflict."] },
    { id: 468, area: "practice", lvl: "A", prov: "NB", stem: "WorkSafeNB's no-fault compensation means a covered injured worker:", opts: ["Can still sue an employer who is partly at fault", "Cannot sue their employer for covered injuries and receives WorkSafeNB benefits instead", "Only gets coverage for severe injuries", "Must prove employer negligence"], ans: 1, src: "Workers' Compensation Act (New Brunswick)", exp: "WorkSafeNB's no-fault system bars civil suits and provides compensation without requiring proof of fault.", notes: ["Civil suits are barred.", "Correct.", "Coverage is broad.", "No-fault means fault is irrelevant."] },
    { id: 469, area: "poa", lvl: "A", prov: "NB", stem: "An NB driver who receives a traffic ticket and wants to dispute it generally must:", opts: ["Not pay the ticket", "Request a hearing within the time specified on the ticket", "Contact the police officer", "File with the Human Rights Commission"], ans: 1, src: "Provincial Offences Procedure Act / Motor Vehicle Act (NB)", exp: "NB traffic ticket disputes require requesting a hearing within the time stated on the ticket.", notes: ["Leads to default conviction.", "Correct.", "Not the mechanism.", "Wrong body."] },
    { id: 470, area: "civil", lvl: "A", prov: "NB", stem: "A successful NB Small Claims plaintiff can enforce the judgment by:", opts: ["No enforcement exists", "Using enforcement tools such as garnishment of wages or bank accounts", "Filing in Superior Court only", "Asking the police to collect"], ans: 1, src: "Small Claims Act / Enforcement of Judgments Act (NB)", exp: "Small claims judgments in NB can be enforced through garnishment and other civil enforcement mechanisms.", notes: ["Enforcement mechanisms exist.", "Correct.", "Not necessary to re-file.", "Not a police matter."] },
    /* ============== NOVA SCOTIA — 20 QUESTIONS (471-490) ============== */
    { id: 471, area: "ethics", lvl: "C", prov: "NS", stem: "Lawyers in Nova Scotia are regulated by:", opts: ["The Law Society of Ontario", "The Nova Scotia Barristers' Society (NSBS)", "The NS Justice Department", "The Canadian Bar Association"], ans: 1, src: "Legal Profession Act (Nova Scotia)", exp: "The Nova Scotia Barristers' Society regulates the legal profession in Nova Scotia.", notes: ["Ontario regulator.", "Correct.", "Government.", "Advisory body."] },
    { id: 472, area: "civil", lvl: "C", prov: "NS", stem: "Nova Scotia's superior court is the:", opts: ["NS Provincial Court", "Supreme Court of Nova Scotia", "NS Court of Appeal", "Small Claims Court"], ans: 1, src: "Judicature Act (Nova Scotia)", exp: "The Supreme Court of Nova Scotia is the province's superior trial court with inherent jurisdiction.", notes: ["Limited jurisdiction.", "Correct.", "Appellate.", "Has monetary limits."] },
    { id: 473, area: "civil", lvl: "C", prov: "NS", stem: "Nova Scotia's Small Claims Court handles claims up to:", opts: ["$10,000", "$15,000", "$25,000", "$35,000"], ans: 2, src: "Small Claims Court Act (Nova Scotia)", exp: "NS Small Claims Court handles civil claims up to $25,000.", notes: ["Too low.", "Too low.", "Correct.", "Exceeds the limit."] },
    { id: 474, area: "admin", lvl: "C", prov: "NS", stem: "Residential tenancy disputes in Nova Scotia are resolved through:", opts: ["The Landlord and Tenant Board", "The Director of Residential Tenancies (NS)", "The NS Human Rights Commission", "The Supreme Court only"], ans: 1, src: "Residential Tenancies Act (Nova Scotia)", exp: "The Director of Residential Tenancies handles NS tenancy disputes under the Residential Tenancies Act.", notes: ["Ontario body.", "Correct.", "Different mandate.", "The Director is the first forum."] },
    { id: 475, area: "admin", lvl: "C", prov: "NS", stem: "The time limit to file a Nova Scotia Human Rights Commission complaint is generally:", opts: ["6 months", "1 year", "2 years", "No limit"], ans: 1, src: "Human Rights Act (Nova Scotia)", exp: "NS human rights complaints must generally be filed within 1 year of the last incident.", notes: ["Too short.", "Correct.", "Too long.", "There is a limit."] },
    { id: 476, area: "practice", lvl: "C", prov: "NS", stem: "Workers injured in Nova Scotia receive compensation through:", opts: ["The court system", "The Workers' Compensation Board of Nova Scotia (WCB NS)", "NS Health Authority", "Employment Insurance"], ans: 1, src: "Workers' Compensation Act (Nova Scotia)", exp: "WCB Nova Scotia administers the no-fault workplace compensation system.", notes: ["Civil suits are barred.", "Correct.", "Different mandate.", "Different program."] },
    { id: 477, area: "poa", lvl: "C", prov: "NS", stem: "Traffic offences in Nova Scotia are governed by the:", opts: ["Criminal Code alone", "Motor Vehicle Act (Nova Scotia)", "Federal regulations only", "Highway Traffic Act (Ontario)"], ans: 1, src: "Motor Vehicle Act (Nova Scotia)", exp: "The Motor Vehicle Act is NS's provincial legislation governing road use and traffic offences.", notes: ["Federal criminal law is separate.", "Correct.", "Federal standards are separate.", "Ontario legislation."] },
    { id: 478, area: "practice", lvl: "C", prov: "NS", stem: "Minimum employment standards in Nova Scotia are set by the:", opts: ["Canada Labour Code only", "Labour Standards Code (Nova Scotia)", "Common law only", "Criminal Code"], ans: 1, src: "Labour Standards Code (Nova Scotia)", exp: "Nova Scotia uses the Labour Standards Code — not 'Employment Standards Act' as in most provinces. This is a distinguishing feature.", notes: ["Federal for federally regulated.", "Correct.", "The Code supplements common law.", "Wrong."] },
    { id: 479, area: "ethics", lvl: "C", prov: "NS", stem: "Interest on Nova Scotia lawyers' pooled trust accounts funds:", opts: ["The lawyer personally", "Legal Aid Nova Scotia and access to justice programs", "The provincial government", "The NSBS directly"], ans: 1, src: "Legal Profession Act (Nova Scotia) — trust accounts", exp: "Trust account interest in Nova Scotia funds legal aid and access to justice programs.", notes: ["Not permitted.", "Correct.", "Not government revenue.", "NSBS funds itself separately."] },
    { id: 480, area: "civil", lvl: "C", prov: "NS", stem: "Nova Scotia's limitation period for most civil claims is:", opts: ["1 year", "2 years", "6 years", "10 years"], ans: 1, src: "Limitation of Actions Act (Nova Scotia)", exp: "Nova Scotia's Limitation of Actions Act provides a 2-year basic limitation period from discoverability.", notes: ["Too short.", "Correct.", "Old period.", "Too long."] },
    { id: 481, area: "admin", lvl: "A", prov: "NS", stem: "Nova Scotia's Human Rights Commission investigates complaints under the:", opts: ["Canadian Charter only", "Human Rights Act (Nova Scotia)", "Motor Vehicle Act", "Labour Standards Code"], ans: 1, src: "Human Rights Act (Nova Scotia)", exp: "The NS Human Rights Commission processes complaints under the Human Rights Act, which applies to both public and private actors.", notes: ["The provincial statute applies to private actors.", "Correct.", "Traffic legislation.", "Employment standards."] },
    { id: 482, area: "civil", lvl: "A", prov: "NS", stem: "Appeals from the Supreme Court of Nova Scotia lie to:", opts: ["The NS Provincial Court", "The Nova Scotia Court of Appeal", "The Federal Court", "The Supreme Court of Canada directly"], ans: 1, src: "Court of Appeal Act (Nova Scotia)", exp: "The Nova Scotia Court of Appeal hears appeals from the Supreme Court of Nova Scotia.", notes: ["Provincial Court appeals go to Supreme Court first.", "Correct.", "Federal matters.", "Not the first appeal."] },
    { id: 483, area: "practice", lvl: "A", prov: "NS", stem: "Under Nova Scotia's no-fault workers' compensation system, an injured worker generally:", opts: ["Can sue their employer", "Cannot sue their employer but receives WCB NS compensation instead", "Chooses between suing and WCB", "Gets nothing if partly at fault"], ans: 1, src: "Workers' Compensation Act (Nova Scotia)", exp: "NS's no-fault system bars civil suits against employers for covered workplace injuries.", notes: ["Barred.", "Correct.", "No choice.", "No-fault."] },
    { id: 484, area: "ethics", lvl: "A", prov: "NS", stem: "A Nova Scotia lawyer who discovers a trust shortfall must:", opts: ["Cover it quietly", "Correct the shortfall and report as required under NSBS rules", "Wait for an audit", "Blame the bookkeeper"], ans: 1, src: "Nova Scotia Barristers' Society — Professional Responsibility", exp: "Trust shortfalls must be corrected and reported; concealment is professional misconduct.", notes: ["Concealment is improper.", "Correct.", "Delay is improper.", "Blame-shifting does not address it."] },
    { id: 485, area: "admin", lvl: "A", prov: "NS", stem: "Judicial review of Nova Scotia tribunal decisions is brought in:", opts: ["NS Provincial Court", "Supreme Court of Nova Scotia", "The NS Court of Appeal directly", "The Federal Court"], ans: 1, src: "Judicial Review Act (Nova Scotia)", exp: "Judicial review of provincial tribunal decisions in NS is brought in the Supreme Court of Nova Scotia.", notes: ["No jurisdiction.", "Correct.", "Not the first step.", "For federal tribunals."] },
    { id: 486, area: "admin", lvl: "C", prov: "NS", stem: "Nova Scotia's Human Rights Act prohibits discrimination in areas including:", opts: ["Employment only", "Employment, accommodation, and services", "Government services only", "Schools only"], ans: 1, src: "Human Rights Act (Nova Scotia)", exp: "The NS Human Rights Act prohibits discrimination in employment, accommodation, and services, among other areas.", notes: ["Broader.", "Correct.", "Broader.", "Much broader."] },
    { id: 487, area: "ethics", lvl: "X", prov: "NS", scen: "A NS lawyer is retained by a new client whose interests are directly adverse to a former client on the same matter.", stem: "The lawyer should:", opts: ["Proceed — the retainer is over", "Decline due to duties of loyalty and confidentiality owed to the former client", "Proceed with disclosure only", "Ask the court for permission"], ans: 1, src: "Nova Scotia Barristers' Society — Code of Professional Conduct", exp: "Duties to former clients — especially confidentiality and loyalty — can bar acting against them on the same or related matters.", notes: ["Duties survive the retainer.", "Correct.", "Disclosure alone may be insufficient.", "Not a court matter."] },
    { id: 488, area: "practice", lvl: "C", prov: "NS", stem: "Unauthorized practice of law in Nova Scotia is prohibited under:", opts: ["Federal regulations", "The Legal Profession Act (Nova Scotia)", "Only civil liability", "Common law only"], ans: 1, src: "Legal Profession Act (Nova Scotia)", exp: "The Legal Profession Act prohibits unauthorized legal practice in Nova Scotia.", notes: ["Provincial legislation governs.", "Correct.", "Has regulatory consequences.", "Statute governs."] },
    { id: 489, area: "poa", lvl: "A", prov: "NS", stem: "An NS driver who receives a traffic ticket and wants to dispute it generally must:", opts: ["Not pay it", "Request a hearing within the time stated on the ticket", "Contact the police officer", "Apply to the Human Rights Commission"], ans: 1, src: "Summary Proceedings Act / Motor Vehicle Act (Nova Scotia)", exp: "Disputing an NS traffic ticket requires requesting a hearing within the time indicated on the ticket.", notes: ["Leads to default conviction.", "Correct.", "Not the mechanism.", "Wrong body."] },
    { id: 490, area: "civil", lvl: "A", prov: "NS", stem: "A Nova Scotia Small Claims plaintiff can enforce a judgment by:", opts: ["No enforcement mechanisms", "Using garnishment and other civil enforcement tools", "Filing in Supreme Court only", "Asking the police"], ans: 1, src: "Small Claims Court Act / Civil Procedure Rules (Nova Scotia)", exp: "Small Claims judgments in NS can be enforced through garnishment and other civil enforcement mechanisms.", notes: ["Enforcement exists.", "Correct.", "Not necessary to re-file.", "Not a police matter."] },
    /* ============== PRINCE EDWARD ISLAND — 15 QUESTIONS (491-505) ============== */
    { id: 491, area: "ethics", lvl: "C", prov: "PE", stem: "Lawyers in Prince Edward Island are regulated by:", opts: ["The Law Society of Ontario", "The Law Society of Prince Edward Island (LSPEI)", "The PEI Justice Department", "The Canadian Bar Association"], ans: 1, src: "Legal Profession Act (Prince Edward Island)", exp: "The Law Society of Prince Edward Island regulates lawyers under the Legal Profession Act.", notes: ["Ontario regulator.", "Correct.", "Government.", "Advisory body."] },
    { id: 492, area: "civil", lvl: "C", prov: "PE", stem: "PEI's superior court is the:", opts: ["PEI Provincial Court", "Supreme Court of Prince Edward Island", "PEI Court of Appeal", "Small Claims Section"], ans: 1, src: "Supreme Court Act (PEI)", exp: "The Supreme Court of PEI is the province's superior trial court.", notes: ["Limited jurisdiction.", "Correct.", "Appellate.", "Monetary limits apply."] },
    { id: 493, area: "civil", lvl: "C", prov: "PE", stem: "PEI's Small Claims Section handles civil claims up to:", opts: ["$10,000", "$15,000", "$25,000", "$50,000"], ans: 2, src: "Provincial Court Act (PEI) — Small Claims", exp: "PEI's Small Claims Section handles claims up to $25,000.", notes: ["Too low.", "Too low.", "Correct.", "Exceeds the limit."] },
    { id: 494, area: "admin", lvl: "C", prov: "PE", stem: "Residential tenancy disputes in PEI are resolved through:", opts: ["The Landlord and Tenant Board", "The Island Regulatory and Appeals Commission (IRAC)", "The PEI Human Rights Commission", "The Supreme Court only"], ans: 1, src: "Rental of Residential Property Act (PEI)", exp: "IRAC adjudicates residential tenancy disputes under the Rental of Residential Property Act in PEI.", notes: ["Ontario body.", "Correct — IRAC is PEI's unique multi-sector regulatory body.", "Different mandate.", "IRAC is the first forum."] },
    { id: 495, area: "admin", lvl: "A", prov: "PE", stem: "IRAC in PEI is unique because it:", opts: ["Only handles environmental matters", "Is a combined regulatory, appeals, and adjudication body handling multiple sectors including residential tenancy", "Only handles criminal matters", "Only handles tax appeals"], ans: 1, src: "Island Regulatory and Appeals Commission Act (PEI)", exp: "IRAC handles multiple sectors — residential tenancy, energy, transportation — making it PEI's unique multi-sector regulatory body.", notes: ["It covers many sectors.", "Correct.", "Not criminal.", "Not just tax."] },
    { id: 496, area: "admin", lvl: "C", prov: "PE", stem: "The time limit to file a PEI Human Rights Commission complaint is generally:", opts: ["6 months", "12 months", "2 years", "No limit"], ans: 1, src: "Human Rights Act (PEI)", exp: "PEI human rights complaints must generally be filed within 12 months of the alleged act.", notes: ["Too short.", "Correct.", "Too long.", "There is a limit."] },
    { id: 497, area: "practice", lvl: "C", prov: "PE", stem: "Workers injured in PEI receive compensation through:", opts: ["The court system", "The Workers Compensation Board of PEI (WCB PEI)", "PEI Health", "Employment Insurance"], ans: 1, src: "Workers Compensation Act (PEI)", exp: "WCB PEI administers the no-fault workplace injury compensation system in PEI.", notes: ["Civil suits are barred.", "Correct.", "Different mandate.", "Different program."] },
    { id: 498, area: "poa", lvl: "C", prov: "PE", stem: "Traffic offences in PEI are governed by the:", opts: ["Criminal Code alone", "Highway Traffic Act (PEI)", "Federal regulations only", "Highway Traffic Act (Ontario)"], ans: 1, src: "Highway Traffic Act (Prince Edward Island)", exp: "PEI's Highway Traffic Act governs road use and traffic offences in the province.", notes: ["Federal criminal law is separate.", "Correct.", "Provincial legislation governs.", "Ontario legislation."] },
